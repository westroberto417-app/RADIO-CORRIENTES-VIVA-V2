    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      (function() {
        var isViteMsg = function(arg) {
          if (!arg) return false;
          try {
            if (typeof arg === 'string') return arg.indexOf('[vite]') !== -1 || arg.indexOf('vite-hmr') !== -1;
            if (typeof arg === 'object') {
              if (arg.message && typeof arg.message === 'string' && (arg.message.indexOf('[vite]') !== -1 || arg.message.indexOf('WebSocket') !== -1)) return true;
              if (arg.stack && typeof arg.stack === 'string' && arg.stack.indexOf('@vite/client') !== -1) return true;
            }
          } catch(err) {}
          return false;
        };
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && (isViteMsg(e.message) || isViteMsg(e.error) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && (isViteMsg(e.reason) || (e.reason && isViteMsg(e.reason.message)))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
